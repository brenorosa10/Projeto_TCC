worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    # O Astro envia imagens de alternativa em POST /api/media (até 3 MB).
    client_max_body_size 21m;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream astro {
        server astro-frontend:80;
    }

    upstream scorehistory {
        server scorehistory-frontend:80;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name astroarq.online www.astroarq.online scorehistory.tech www.scorehistory.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.astroarq.online;

        ssl_certificate /etc/letsencrypt/live/astroarq.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/astroarq.online/privkey.pem;

        return 301 https://astroarq.online$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name astroarq.online;

        ssl_certificate /etc/letsencrypt/live/astroarq.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/astroarq.online/privkey.pem;

        location / {
            proxy_pass http://astro;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            # Do not cache here. The frontend container sets Cache-Control
            # (no-store for index.html, immutable for /assets). A blanket header
            # or proxy_cache on this edge would pin an old SPA shell after deploy.
            proxy_cache off;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name www.scorehistory.tech;

        ssl_certificate /etc/letsencrypt/live/scorehistory.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/scorehistory.tech/privkey.pem;

        return 301 https://scorehistory.tech$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name scorehistory.tech;

        ssl_certificate /etc/letsencrypt/live/scorehistory.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/scorehistory.tech/privkey.pem;

        location / {
            proxy_pass http://scorehistory;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }
}
