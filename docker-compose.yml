services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PORT: "8080"
      ConnectionStrings__MongoDb: ${ConnectionStrings__MongoDb}
      Auth__FrontendUrl: ${Auth__FrontendUrl}
      Auth__Google__ClientId: ${Auth__Google__ClientId}
      Auth__Google__ClientSecret: ${Auth__Google__ClientSecret}
      Auth__Jwt__Key: ${Auth__Jwt__Key}
      Auth__Jwt__Issuer: ${Auth__Jwt__Issuer:-Astro.Api}
      Auth__Jwt__Audience: ${Auth__Jwt__Audience:-Astro.Frontend}
      Cors__Origins: ${Cors__Origins}
      # Mesmo caminho do volume abaixo. Não separe os dois.
      Media__Root: /data/media
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.8-flash}
      Gemini__FallbackModel: ${GEMINI_FALLBACK_MODEL:-}
    volumes:
      - backend-dp-keys:/app/dp-keys
      - backend-media:/data/media
    expose:
      - "8080"

  astro-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: astro-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - default
      - proxy

volumes:
  backend-dp-keys:
  backend-media:

networks:
  proxy:
    external: true
